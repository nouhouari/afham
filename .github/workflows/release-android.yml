name: Release Android

# Locked decisions (docs/PLAN.md §Phase 8):
#   Trigger on tag v*. Build a signed release App Bundle, then `fastlane supply`
#   to the Play **Internal** track. Production track is OFF.
#   Deploy steps are INACTIVE until the required secrets are provided — until
#   then the workflow still builds the bundle and uploads it as an artifact.
#
# Required GitHub secrets (base64 where noted):
#   ANDROID_KEYSTORE_BASE64        upload-keystore.jks, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON      Google Play service-account JSON (raw)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    name: Build & (conditionally) ship to Play Internal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing/deploy readiness
        id: gate
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "sign=$([[ -n "$KS" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "deploy=$([[ -n "$PLAY" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode upload keystore
        if: steps.gate.outputs.sign == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Build release App Bundle
        # Build number derived from the CI run number per the locked decisions.
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Ship to Play Internal (fastlane supply)
        if: steps.gate.outputs.deploy == 'true'
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          bundle install
          bundle exec fastlane internal

      - name: Deploy skipped (no credentials yet)
        if: steps.gate.outputs.deploy != 'true'
        run: echo "::notice::Play credentials not set — built the AAB but skipped the Internal-track upload. Add PLAY_SERVICE_ACCOUNT_JSON + keystore secrets to activate."
