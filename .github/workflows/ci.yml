name: CI

# Locked decisions (docs/PLAN.md §Phase 8):
#   pub get -> build_runner -> analyze -> format check -> test --coverage -> validation build
#   Flutter pinned to 3.44.1; pub + gradle cached.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze · Format · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation (Drift / Riverpod / slang)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Format check (hand-written sources only)
        # Generated *.g.dart are excluded so codegen reformatting never breaks CI.
        run: git ls-files '*.dart' ':!:*.g.dart' | xargs dart format --output=none --set-exit-if-changed

      - name: Test (with coverage)
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Validation build (debug APK)
        run: flutter build apk --debug
